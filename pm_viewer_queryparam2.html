<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PM Interactive Viewer</title>
<style>
body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.app{display:grid;grid-template-columns:2fr 1fr;gap:12px;height:100vh;padding:12px;box-sizing:border-box}
.btn,label.file{background:#0b1220;border:1px solid #334155;color:#e5e7eb;font-weight:700;border-radius:10px;padding:6px 10px;appearance:none;cursor:pointer}
input[type=file]{display:none}
.pane{background:#0b1220;border:1px solid #1f2937;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
h3{margin:10px 12px;color:#94a3b8;font-size:22px}
.wrap{flex:1;position:relative}
svg{width:100%;height:100%;display:block}
.pt{cursor:pointer}
.pt.selected{stroke:#fff;stroke-width:1.6}
.contour-line{fill:none;stroke:#000;stroke-width:1.2;opacity:0.95}
.raster-cell{stroke:none}
.outline{fill:none;stroke:#e5e7eb;stroke-width:2}
.meta{font-size:12px;color:#94a3b8;margin:6px 10px 10px}
#tt{position:absolute;display:none;background:#0b1220;border:1px solid #334155;border-radius:8px;padding:6px 8px;font-size:12px;color:#e5e7eb;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.35)}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}.wrap{height:60vh}}
</style></head>
<body><div class="app">
<div class="pane"><h3 id="density-header">Density map, Gulf of Mexico sediment trap</h3><div class="wrap"><svg id="morpho"></svg><div id="tt"></div></div><div class="meta" id="legend">Ready.</div></div>
<div class="pane"><h3 id="outline-header">Specimen outline</h3><div class="wrap"><svg id="outline"></svg></div><div class="meta" id="status">No specimen selected.</div></div>
</div>
<script>
const $=s=>document.querySelector(s); const svgMorpho=$("#morpho"), svgOutline=$("#outline");
let DATA=null, SEL=null;
function clear(svg){while(svg.firstChild) svg.removeChild(svg.firstChild);}
function lin(domain,range){const[d0,d1]=domain,[r0,r1]=range,m=(r1-r0)/(d1-d0||1);const f=x=>r0+(x-d0)*m;f.inv=y=>d0+(y-r0)/m;return f;}

function colorScaleX(x,xmin,xmax){
  if(xmin===undefined||xmax===undefined||!isFinite(x)) return '#ef4444';
  const t=(x - xmin) / (xmax - xmin || 1);
  const hue=220 + (10 - 220) * Math.min(Math.max(t,0),1);
  return `hsl(${hue},80%,55%)`;
}

function mean(arr){ return arr.reduce((a,b)=>a+b,0)/(arr.length||1); }
function sd(arr){
  const m = mean(arr);
  const v = arr.reduce((a,b)=>a + (b-m)*(b-m), 0) / Math.max(arr.length - 1, 1);
  return Math.sqrt(v);
}

// R MASS::bandwidth.nrd-style scale (Silverman/NRD spirit)
function bandwidthNRD(arr){
  const n = arr.length || 1;
  const s = sd(arr) || 1e-6;
  return 1.06 * s * Math.pow(n, -0.2);
}

// MASS-like 2D KDE evaluated on a regular grid.
// This replaces the previous hand-built multi-scale count grid.
function kde2dMassStyle(pts, xdom, ydom, n=50, bwScale=1.0){
  const xs = new Float64Array(n);
  const ys = new Float64Array(n);
  for(let i=0;i<n;i++){
    xs[i] = xdom[0] + i * (xdom[1]-xdom[0]) / (n-1 || 1);
    ys[i] = ydom[0] + i * (ydom[1]-ydom[0]) / (n-1 || 1);
  }

  const xvals = pts.map(p=>p.x);
  const yvals = pts.map(p=>p.y);
  const N = pts.length || 1;

  let hx = bandwidthNRD(xvals) * bwScale;
  let hy = bandwidthNRD(yvals) * bwScale;
  hx = Math.max(hx, 1e-6);
  hy = Math.max(hy, 1e-6);

  const values = new Float64Array(n*n);
  const invHx = 1 / hx, invHy = 1 / hy;
  const norm = 1 / (2 * Math.PI * hx * hy * N);

  for(let j=0;j<n;j++){
    const gy = ys[j];
    for(let i=0;i<n;i++){
      const gx = xs[i];
      let s = 0;
      for(let k=0;k<N;k++){
        const dx = (gx - pts[k].x) * invHx;
        const dy = (gy - pts[k].y) * invHy;
        s += Math.exp(-0.5 * (dx*dx + dy*dy));
      }
      values[j*n + i] = norm * s;
    }
  }

  return {
    nx:n, ny:n, xs, ys, values,
    xdom:[...xdom], ydom:[...ydom],
    dx:(xdom[1]-xdom[0])/(n-1 || 1),
    dy:(ydom[1]-ydom[0])/(n-1 || 1),
    hx, hy
  };
}

function iso(grid, levels){
  const {nx, ny, values, xdom, ydom, dx, dy} = grid;
  const V = (i,j)=>values[j*nx+i];
  const X = i => xdom[0] + i*dx;
  const Y = j => ydom[0] + j*dy;
  const interp = (a,b,va,vb,t)=> {
    if(Math.abs(vb-va) < 1e-12) return (a+b)/2;
    return a + (t-va)*(b-a)/(vb-va);
  };

  const out = [];
  for(const t of levels){
    const segs = [];
    for(let j=0; j<ny-1; j++){
      for(let i=0; i<nx-1; i++){
        const v00=V(i,j),   v10=V(i+1,j),
              v01=V(i,j+1), v11=V(i+1,j+1);

        const pts = [];
        if((v00<t)!=(v01<t)) pts.push([X(i),   interp(Y(j),Y(j+1),v00,v01,t)]);
        if((v10<t)!=(v11<t)) pts.push([X(i+1), interp(Y(j),Y(j+1),v10,v11,t)]);
        if((v00<t)!=(v10<t)) pts.push([interp(X(i),X(i+1),v00,v10,t), Y(j)]);
        if((v01<t)!=(v11<t)) pts.push([interp(X(i),X(i+1),v01,v11,t), Y(j+1)]);

        if(pts.length===2) segs.push([pts[0], pts[1]]);
        else if(pts.length===4){
          segs.push([pts[0], pts[1]]);
          segs.push([pts[2], pts[3]]);
        }
      }
    }

    const eq=(p,q)=>Math.abs(p[0]-q[0])<1e-6 && Math.abs(p[1]-q[1])<1e-6;
    const paths = [];
    while(segs.length){
      const first = segs.pop();
      const path = [first[0], first[1]];
      let changed = true;
      while(changed){
        changed = false;
        for(let s=segs.length-1; s>=0; s--){
          const [u,v] = segs[s];
          const head = path[0], tail = path[path.length-1];
          if(eq(v, head)){ path.unshift(u); segs.splice(s,1); changed=true; }
          else if(eq(u, head)){ path.unshift(v); segs.splice(s,1); changed=true; }
          else if(eq(u, tail)){ path.push(v); segs.splice(s,1); changed=true; }
          else if(eq(v, tail)){ path.push(u); segs.splice(s,1); changed=true; }
        }
      }
      if(path.length >= 4) paths.push(path);
    }
    out.push({t, paths});
  }
  return out;
}

function grayForValue(v, vmax){
  const u = Math.min(Math.max(v / (vmax || 1), 0), 1);
  const light = 24 + 62*u;
  return `hsl(0,0%,${light}%)`;
}

function renderMorpho(){
  const ttEl = document.getElementById('tt');
  clear(svgMorpho); if(!DATA) return;
  const W=svgMorpho.clientWidth||600, H=svgMorpho.clientHeight||500; svgMorpho.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const pts=DATA.points.map((p,i)=>({...p,i}));
  const hasZ = pts.length && ('z' in pts[0]);
  if(!pts.length){ $("#legend").textContent="No morphospace points."; return; }

  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);

  // Match your father's MASS::kde2d setup more closely.
  // If the points already look like GPA stdscores, fix lims to [-3,3,-3,3].
  // Otherwise fall back to padded data extents.
  const looksStandardized = xmin >= -3.25 && xmax <= 3.25 && ymin >= -3.25 && ymax <= 3.25;
  const lims = looksStandardized ? [-3, 3, -3, 3] : (()=>{
    const pad=0.10, xr=(xmax-xmin||1), yr=(ymax-ymin||1);
    return [xmin-xr*pad, xmax+xr*pad, ymin-yr*pad, ymax+yr*pad];
  })();
  const xdom=[lims[0], lims[1]], ydom=[lims[2], lims[3]];

  const x=lin(xdom,[48,W-16]), y=lin(ydom,[H-32,16]);

  // MASS-like KDE on supplied B / GPA coordinates.
  // bwScale is your main tuning knob:
  // 1.0 = closer to default MASS feel
  // >1.0 = smoother, fewer outlier islands
  const kdeN = 50;
  const bwScale = 1.0;
  const grid = kde2dMassStyle(pts, xdom, ydom, kdeN, bwScale);
  const vmax = Math.max(...grid.values) || 1;

  // grayscale raster underneath
  const rasterG = document.createElementNS("http://www.w3.org/2000/svg","g");
  for(let j=0; j<grid.ny-1; j++){
    for(let i=0; i<grid.nx-1; i++){
      const v = grid.values[j*grid.nx+i];
      if(v <= vmax*0.001) continue;
      const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
      const x0 = x(grid.xdom[0] + i*grid.dx);
      const x1 = x(grid.xdom[0] + (i+1)*grid.dx);
      const y0 = y(grid.ydom[0] + j*grid.dy);
      const y1 = y(grid.ydom[0] + (j+1)*grid.dy);
      rect.setAttribute("x", Math.min(x0,x1));
      rect.setAttribute("y", Math.min(y0,y1));
      rect.setAttribute("width", Math.abs(x1-x0)+0.4);
      rect.setAttribute("height", Math.abs(y1-y0)+0.4);
      rect.setAttribute("fill", grayForValue(v, vmax));
      rect.setAttribute("class", "raster-cell");
      rect.setAttribute("opacity", "0.72");
      rasterG.appendChild(rect);
    }
  }
  svgMorpho.appendChild(rasterG);

  // contour lines from KDE surface
const levels = [0.08, 0.12, 0.17, 0.24, 0.34, 0.48, 0.66]
    .map(p=>p*vmax)
    .filter(v=>v>0);
  const contours = iso(grid, levels);
  const contourG = document.createElementNS("http://www.w3.org/2000/svg","g");
  for(const c of contours){
    for(const path of c.paths){
      if(path.length < 4) continue;
      const d = path.map((p, idx)=>`${idx?'L':'M'}${x(p[0])} ${y(p[1])}`).join(' ');
      const el = document.createElementNS("http://www.w3.org/2000/svg","path");
      el.setAttribute("d", d);
      el.setAttribute("class", "contour-line");
      contourG.appendChild(el);
    }
  }
  svgMorpho.appendChild(contourG);

  // axes on top of raster
  const ax=document.createElementNS("http://www.w3.org/2000/svg","g");
  ax.innerHTML=`<line x1="${x(xdom[0])}" y1="${y(0)}" x2="${x(xdom[1])}" y2="${y(0)}" stroke="#6b7280"/>
                <line x1="${x(0)}" y1="${y(ydom[0])}" x2="${x(0)}" y2="${y(ydom[1])}" stroke="#6b7280"/>`;
  svgMorpho.appendChild(ax);

  // points with labels
  for(const p of pts){
    const cx = x(p.x), cy = y(p.y);

    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", cx);
    c.setAttribute("cy", cy);
    c.setAttribute("r", 4.5);
    c.setAttribute("class","pt");
    c.setAttribute("fill", "#ef4444");
    c.setAttribute("stroke", "#7f1d1d");
    c.setAttribute("stroke-width", "0.6");

    c.addEventListener("mouseenter",(e)=>{
      if(!ttEl) return;
      ttEl.style.display="block";
      ttEl.textContent = `id ${p.id ?? p.i} | spec_idx ${p.spec_idx ?? (p.i+1)} | x ${Number(p.x).toFixed(3)} | y ${Number(p.y).toFixed(3)}` + (hasZ ? ` | z ${p.z}` : "");
    });
    c.addEventListener("mousemove",(e)=>{
      if(!ttEl) return;
      const rect = e.target.ownerSVGElement.getBoundingClientRect();
      ttEl.style.left = (e.clientX - rect.left + 10) + "px";
      ttEl.style.top  = (e.clientY - rect.top  - 10) + "px";
    });
    c.addEventListener("mouseleave",()=>{ if(ttEl) ttEl.style.display="none"; });

    c.addEventListener("click",()=>{
      Array.from(svgMorpho.querySelectorAll(".pt")).forEach(n=>n.classList.remove("selected"));
      c.classList.add("selected");
      SEL=p;
      renderOutline();
      $("#legend").textContent=`Selected id ${p.id??p.i} → idx ${p.spec_idx??(p.i+1)} | MASS-style KDE contour plot from supplied GPA xy`;
    });
    svgMorpho.appendChild(c);

    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("x", cx + 5);
    label.setAttribute("y", cy + 4);
    label.setAttribute("fill", "#ef4444");
    label.setAttribute("font-size", "11");
    label.setAttribute("font-weight", "700");
    label.textContent = String(p.spec_idx ?? p.id ?? (p.i+1));
    svgMorpho.appendChild(label);
  }

  if(!SEL){
    $("#legend").textContent=`MASS-style KDE (n=${kdeN}, bwScale=${bwScale.toFixed(2)}) on supplied GPA xy data; outlines still use raw A xy data.`;
  }
}

function fit(points,W,H,pad=20){
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y), minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=maxX-minX,h=maxY-minY; const sx=(W-2*pad)/(w||1), sy=(H-2*pad)/(h||1), s=Math.min(sx,sy);
  return{ s, tx:(W-s*w)/2 - s*minX, ty:(H-s*h)/2 - s*minY };
}

function renderOutline(){
  clear(svgOutline); const W=svgOutline.clientWidth||500,H=svgOutline.clientHeight||500; svgOutline.setAttribute("viewBox",`0 0 ${W} ${H}`);
  if(!DATA||!SEL){ $("#status").textContent="No specimen selected."; $("#outline-header").innerHTML="Specimen outline"; return; }
  const idx=(SEL.spec_idx??(SEL.i+1)); const outline=DATA.outlines[idx-1]||DATA.outlines[idx];
  if(!outline){ $("#status").textContent=`No outline for ${idx}`; return; }

  $("#outline-header").innerHTML=`Specimen outline <span style="font-size:18px;color:#94a3b8;font-weight:normal">#${idx}</span>`;

  const flipped = outline.map(p => ({ x: p.x, y: -p.y }));
  const t=fit(flipped,W,H,24), pts=flipped.map(p=>({X:t.s*p.x+t.tx,Y:t.s*p.y+t.ty}));

  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  let d="M "+pts[0].X+" "+pts[0].Y; for(let i=1;i<pts.length;i++) d+=" L "+pts[i].X+" "+pts[i].Y; d+=" Z";
  path.setAttribute("d",d); path.setAttribute("class","outline"); svgOutline.appendChild(path);
  $("#status").textContent=`Outline index ${idx}, points: ${outline.length}`;
}

function reset(){ SEL=null; $("#legend").textContent="Ready."; $("#status").textContent="No specimen selected."; $("#outline-header").innerHTML="Specimen outline"; renderMorpho(); clear(svgOutline); }

function normalizeData(raw){
  let d = raw;
  if (Array.isArray(d)) d = { outlines: d };

  if (d && Array.isArray(d.specimens) && !d.outlines) {
    const outlines = [];
    for (const s of d.specimens) {
      const o = s.outline || s.outlines || s.points || s.xy || null;
      if (Array.isArray(o)) outlines.push(o);
    }
    d.outlines = outlines;
  }

  if (d && Array.isArray(d.outlines)) {
    d.outlines = d.outlines.map((o) => {
      if (!Array.isArray(o)) return [];
      if (o.length && Array.isArray(o[0])) return o.map(p => ({x:+p[0], y:+p[1]}));
      if (o.length && typeof o[0] === "object") return o.map(p => ({x:+p.x, y:+p.y}));
      return [];
    });
  } else d.outlines = [];

  if (!Array.isArray(d.points)) d.points = [];
  d.points = d.points.map((p, idx) => ({
    id: ("id" in p) ? p.id : (idx+1),
    x: +p.x,
    y: +p.y,
    z: ("z" in p) ? +p.z : 0,
    spec_idx: ("spec_idx" in p) ? p.spec_idx : (idx+1)
  }));

  if (!d.points.length && d.outlines.length) {
    d.points = d.outlines.map((o, idx) => {
      const n = o.length || 1;
      let sx=0, sy=0;
      for (const p of o) { sx += (+p.x||0); sy += (+p.y||0); }
      return { id: idx+1, x: sx/n, y: sy/n, z: 0, spec_idx: idx+1 };
    });
  }
  return d;
}

async function loadFromUrlParam(){
  const u = new URL(window.location.href);
  const titleParam = u.searchParams.get("title");
  const dataParam = u.searchParams.get("data");
  const densityHeader = $("#density-header");

  if(titleParam && densityHeader) densityHeader.textContent = titleParam;
  if(!dataParam) return false;

  const resolved = new URL(dataParam, window.location.href).toString();
  const fnameEl = document.querySelector("#fname");
  if (fnameEl) fnameEl.textContent = dataParam;

  try{
    const resp = await fetch(resolved, { cache: "no-store" });
    if(!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
    DATA = normalizeData(await resp.json());
    if (typeof reset === "function") reset();
    else {
      if (typeof renderMorpho === "function") renderMorpho();
      if (typeof renderOutline === "function") renderOutline();
    }
    if(DATA && DATA.points && DATA.points.length > 0) {
      SEL = DATA.points[0];
      renderOutline();
      $("#legend").textContent = `Selected id ${SEL.id??SEL.i} → idx ${SEL.spec_idx??(SEL.i+1)} | MASS-style KDE contour plot from supplied GPA xy`;
    }
    return true;
  }catch(err){
    const legend = document.querySelector("#legend");
    if (legend) legend.textContent = `Failed to load ${dataParam}: ${err.message}`;
    else console.error(err);
    return false;
  }
}

const fileInput = $("#file");
if(fileInput){
  fileInput.addEventListener("change",e=>{const f=e.target.files[0]; if(!f) return; const fname=$("#fname"); if(fname) fname.textContent=f.name; const r=new FileReader(); r.onload=ev=>{try{DATA=JSON.parse(ev.target.result); reset();}catch(err){alert("Invalid JSON: "+err.message);}}; r.readAsText(f);});
}

const resetBtn = $("#reset");
if(resetBtn) resetBtn.addEventListener("click",reset);

const exportBtn = $("#export");
if(exportBtn) exportBtn.addEventListener("click",()=>{
  if(!DATA||!SEL) return alert("Select a point first.");
  const idx=(SEL.spec_idx??(SEL.i+1)); const outline=DATA.outlines[idx-1]||DATA.outlines[idx]; if(!outline) return alert("No outline found.");

  const flipped = outline.map(p => ({ x: p.x, y: -p.y }));
  const W=600,H=600,t=fit(flipped,W,H,24), pts=flipped.map(p=>({X:t.s*p.x+t.tx,Y:t.s*p.y+t.ty}));
  let d="M "+pts[0].X+" "+pts[0].Y; for(let i=1;i<pts.length;i++) d+=" L "+pts[i].X+" "+pts[i].Y; d+=" Z";
  const svg=`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#0b1220"/><path d="${d}" fill="none" stroke="#e5e7eb" stroke-width="2"/></svg>`;
  const blob=new Blob([svg],{type:"image/svg+xml"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`outline_${idx}_xflip.svg`; a.click(); URL.revokeObjectURL(url);
});

reset();
loadFromUrlParam();
</script></body></html>
